schema: workflow/2022.04
name: Proof Ochestrator
settings:
  error_notification: true
  lambda_memory: 2048
  lambda_timeout: 240
  network: net_5Lnie3
triggers:
- id: hi_MWHpn8Z
steps:
- namespace: check_config_query
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    sql:
      value: |-
        SELECT NEWSLETTER_KEY, DISPLAY_NAME, BRAZE_CATALOG_ID, SLACK_CHANNEL_ID
        FROM MCC_RAW.MARKETING_DEV.NEWSLETTER_CONFIG
        WHERE NEWSLETTER_KEY = :1 AND ENABLED = TRUE
        LIMIT 1
      query: |-
        SELECT NEWSLETTER_KEY, DISPLAY_NAME, BRAZE_CATALOG_ID, SLACK_CHANNEL_ID
        FROM MCC_RAW.MARKETING_DEV.NEWSLETTER_CONFIG
        WHERE NEWSLETTER_KEY = :1 AND ENABLED = TRUE
        LIMIT 1
      params:
      - "{{steps.trigger.event.body.name || steps.trigger.event.body.campaign_name
        || steps.trigger.event.body.canvas_name}}"
- namespace: check_config
  runtime: nodejs20.x
  uses: "./check_config/entry.js"
  props:
    configRows: "{{steps.check_config_query.$return_value}}"
    campaignName: "{{steps.trigger.event.body.name || steps.trigger.event.body.campaign_name
      || steps.trigger.event.body.canvas_name}}"
- namespace: optional_delay
  runtime: nodejs20.x
  uses: "./optional_delay/entry.js"
  props:
    delayMinutes: "{{steps.trigger.event.body.delay_minutes || 0}}"
- namespace: suspend_for_content_prep
  runtime: nodejs20.x
  uses: "./suspend_for_content_prep/entry.js"
  props:
    content_prep_url: https://eo6ad4e0u4fgvuo.m.pipedream.net
    newsletterKey: "{{steps.check_config.$return_value.newsletter_key}}"
    nextSendTime: "{{steps.trigger.event.body.next_send_time}}"
- namespace: utils_rebuild_braze_message
  runtime: nodejs20.x
  uses: "@mcclatchy/utils-rebuild-braze-message@0.0.7"
  props:
    app_id: 3f5340d5-1868-4fc0-b783-b36dd6185ab6
    scheduledItem: "{{steps.trigger.event.body}}"
    subject: "{{steps.trigger.event.body.name}}_{{steps.trigger.context.id}}"
- namespace: suspend_for_render
  runtime: nodejs20.x
  uses: "./suspend_for_render/entry.js"
  props:
    braze_render_url: https://eov0l2spkm1h5vp.m.pipedream.net
    emailBody: "{{steps.utils_rebuild_braze_message.$return_value?.email?.body}}"
    emailSubject: "{{steps.utils_rebuild_braze_message.$return_value?.email?.subject}}"
- namespace: suspend_for_screenshots
  runtime: nodejs20.x
  uses: "./suspend_for_screenshots/entry.js"
  props:
    email_test_api_url: https://eoihl6hmsymk4tc.m.pipedream.net
    renderedHtml: "{{steps.suspend_for_render.$resume_data?.body?.rendered_html}}"
- namespace: extract_screenshots
  runtime: nodejs20.x
  uses: "./extract_screenshots/entry.js"
  props:
    resumeData: "{{steps.suspend_for_screenshots.$resume_data?.body}}"
    renderedHtml: "{{steps.suspend_for_screenshots.$return_value?.rendered_html}}"
- namespace: upload_multiple_screenshots_to_drive
  runtime: nodejs20.x
  uses: "./upload_multiple_screenshots_to_drive/entry.js"
  props:
    screenshots: "{{steps.extract_screenshots.$return_value.screenshots}}"
    nextSendTime: "{{steps.trigger.event.body.next_send_time}}"
    messageName: "{{steps.trigger.event.body.name}}"
- namespace: verify_proof
  runtime: nodejs20.x
  uses: "./verify_proof/entry.js"
  props:
    renderedHtml: "{{steps.suspend_for_screenshots.$return_value?.rendered_html}}"
    screenshots: "{{steps.extract_screenshots.$return_value?.screenshots}}"
    subject: "{{steps.extract_screenshots.$return_value?.realSubject || steps.trigger.event.body.name}}"
- namespace: filter
  runtime: nodejs20.x
  uses: "./filter/entry.js"
  props:
    verifyResult: "{{steps.verify_proof.$return_value}}"
- namespace: fetch_ai_content
  runtime: nodejs20.x
  uses: "./fetch_ai_content/entry.js"
  props:
    newsletterKey: "{{steps.check_config.$return_value.newsletter_key}}"
    contentPrepResume: "{{steps.suspend_for_content_prep.$resume_data?.body}}"
- namespace: suspend_and_post_proof
  runtime: nodejs20.x
  uses: "./suspend_and_post_proof/entry.js"
  props:
    config: "{{steps.check_config.$return_value}}"
    driveFiles: "{{steps.upload_multiple_screenshots_to_drive.$return_value?.uploadedFiles}}"
    verifyResult: "{{steps.verify_proof.$return_value}}"
    nextSendTime: "{{steps.trigger.event.body.next_send_time}}"
    contentPrepResume: "{{steps.suspend_for_content_prep.$resume_data?.body}}"
    aiContent: "{{steps.fetch_ai_content.$return_value}}"
- namespace: extract_decision
  runtime: nodejs20.x
  uses: "./extract_decision/entry.js"
  props:
    config: "{{steps.check_config.$return_value}}"
    runId: "{{steps.suspend_and_post_proof.$return_value?.run_id}}"
    resumeData: "{{steps.suspend_and_post_proof.$resume_data}}"
- namespace: update_run_decision
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    sql:
      value: |-
        UPDATE MCC_RAW.MARKETING_DEV.NEWSLETTER_RUNS
        SET DECISION = :1,
            DECIDED_AT = CURRENT_TIMESTAMP(),
            FINALIZED_AT = CURRENT_TIMESTAMP()
        WHERE RUN_ID = :2
          AND DECISION = 'PENDING'
      query: |-
        UPDATE MCC_RAW.MARKETING_DEV.NEWSLETTER_RUNS
        SET DECISION = :1,
            DECIDED_AT = CURRENT_TIMESTAMP(),
            FINALIZED_AT = CURRENT_TIMESTAMP()
        WHERE RUN_ID = :2
          AND DECISION = 'PENDING'
      params:
      - "{{steps.extract_decision.$return_value.decision}}"
      - "{{steps.extract_decision.$return_value.run_id}}"
- namespace: notify_decision
  runtime: nodejs20.x
  uses: "./notify_decision/entry.js"
  props:
    decision: "{{steps.extract_decision.$return_value.decision}}"
    channel: "{{steps.suspend_and_post_proof.$return_value?.channel}}"
    threadTs: "{{steps.suspend_and_post_proof.$return_value?.ts}}"

