schema: workflow/2022.04
name: Newsletter Content Prep
settings:
  error_notification: true
  lambda_memory: 1024
  lambda_timeout: 60
  network: net_5Lnie3
triggers:
- id: hi_ERHJ2eB
steps:
- namespace: load_config_query
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT NEWSLETTER_KEY, DISPLAY_NAME, FEED_SOURCES, BRAZE_CATALOG_ID,
        MAX_STORIES, SLACK_CHANNEL_ID, APPROVERS, AI_PROMPT_TEMPLATE, AI_MODEL, ENABLED
        FROM MCC_RAW.MARKETING_DEV.NEWSLETTER_CONFIG
        WHERE NEWSLETTER_KEY = :1 AND ENABLED = TRUE
        LIMIT 1
      query: |-
        SELECT NEWSLETTER_KEY, DISPLAY_NAME, FEED_SOURCES, BRAZE_CATALOG_ID,
        MAX_STORIES, SLACK_CHANNEL_ID, APPROVERS, AI_PROMPT_TEMPLATE, AI_MODEL, ENABLED
        FROM MCC_RAW.MARKETING_DEV.NEWSLETTER_CONFIG
        WHERE NEWSLETTER_KEY = :1 AND ENABLED = TRUE
        LIMIT 1
      params:
      - "{{steps.trigger.event.body.newsletter_key}}"
- namespace: load_config
  runtime: nodejs20.x
  uses: "./load_config/entry.js"
- namespace: fetch_feed
  runtime: nodejs20.x
  uses: "./fetch_feed/entry.js"
- namespace: generate_run_id
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: SELECT UUID_STRING() AS RUN_ID
      query: SELECT UUID_STRING() AS RUN_ID
      params: []
- namespace: write_run_history
  runtime: nodejs20.x
  uses: "./write_run_history/entry.js"
- namespace: insert_run_history
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        INSERT INTO MCC_RAW.MARKETING_DEV.NEWSLETTER_RUNS
        (RUN_ID, NEWSLETTER_KEY, NEXT_SEND_TIME, PREP_STARTED_AT, STORIES, DECISION)
        SELECT :1, :2, :3, CURRENT_TIMESTAMP(), PARSE_JSON(:4), 'PENDING'
      query: |-
        INSERT INTO MCC_RAW.MARKETING_DEV.NEWSLETTER_RUNS
        (RUN_ID, NEWSLETTER_KEY, NEXT_SEND_TIME, PREP_STARTED_AT, STORIES, DECISION)
        SELECT :1, :2, :3, CURRENT_TIMESTAMP(), PARSE_JSON(:4), 'PENDING'
      params:
      - "{{steps.write_run_history.$return_value.run_id}}"
      - "{{steps.load_config.$return_value.newsletter_key}}"
      - "{{steps.load_config.$return_value.next_send_time}}"
      - "{{JSON.stringify(steps.fetch_feed.$return_value.stories)}}"
- namespace: json_to_csv
  runtime: nodejs20.x
  uses: "./json_to_csv/entry.js"
- namespace: braze_catalog_update
  runtime: nodejs20.x
  uses: "@mcclatchy/braze-catalog-update@0.0.3"
  props:
    braze:
      authProvisionId: apn_6LhOGA9
    catalogName: "{{steps.load_config.$return_value.braze_catalog_id}}"
    sheetData: "{{steps.json_to_csv.$return_value}}"
    idField: id
- namespace: ghostwriter
  runtime: nodejs20.x
  uses: "./ghostwriter/entry.js"
  props:
    elvex_api_key:
      _enc: c26a1e7f5b4a880668f1bea535c1e53093c16328063b11e18c93b019a4429a65$$UunFCYzLfa39OVUJWCVLZW6sn5z8W/WeB8dQB96LFvq3XLMk11/0SG4WI2HilQ2Neu9MVf67dTfrxTEJy8noHRvjYlDnuUit+BRB/yZBAkE06ixjrA==--DJh7SVRjK/mushyJ--v7bw/jA3A3R9DGjPzKk7IA==
    assistant_id: 39JKVUD02DfsD3222ox6NADElOc
    version: 8
    prompt: "Always respond in valid JSON. Do not include any text before or after
      the JSON block.\n\nGive me Sam's take on the below stories. can you make the
      subject line Sentence Case? \n{{JSON.stringify(steps.json_to_csv.$return_value)}}\n\nreturn
      it as json in the format:\n{\nai_subject: string\nai_intro: string\nai_description:
      string\n}"
- namespace: parse_ghostwriter
  runtime: nodejs20.x
  uses: "./parse_ghostwriter/entry.js"
- namespace: upsert_meta_row
  runtime: nodejs20.x
  uses: "./upsert_meta_row/entry.js"
  props:
    braze:
      authProvisionId: apn_6LhOGA9
- namespace: update_ai_history
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        UPDATE MCC_RAW.MARKETING_DEV.NEWSLETTER_RUNS
        SET AI_SUBJECT = :1, AI_INTRO = :2, AI_MODEL = :3,
        AI_RAW_RESPONSE = PARSE_JSON(:4)
        WHERE RUN_ID = :5
      query: |-
        UPDATE MCC_RAW.MARKETING_DEV.NEWSLETTER_RUNS
        SET AI_SUBJECT = :1, AI_INTRO = :2, AI_MODEL = :3,
        AI_RAW_RESPONSE = PARSE_JSON(:4)
        WHERE RUN_ID = :5
      params:
      - "{{steps.parse_ghostwriter.$return_value.ai_subject}}"
      - "{{steps.parse_ghostwriter.$return_value.ai_intro}}"
      - "elvex"
      - "{{JSON.stringify(steps.ghostwriter.$return_value)}}"
      - "{{steps.write_run_history.$return_value.run_id}}"
- namespace: write_ai_to_history
  runtime: nodejs20.x
  uses: "./write_ai_to_history/entry.js"
- namespace: post_callback
  runtime: nodejs20.x
  uses: "./post_callback/entry.js"

